system:
  # The four roots delightd operates over. They are distinct on purpose: the tree
  # delightd watches is not where it keeps its own state, and the backups
  # directory is one directory under that state tree, not the state tree itself.
  # Each is independently overridable by env (the DELIGHT_* name below) for
  # deployments that relocate the layout -- the in-container paths come from the
  # compose/kube env, not these host defaults. A leading ~ expands to $HOME.
  #
  #   monitor_root  DELIGHT_MONITOR_ROOT  default $DELIGHT_INSTALL_ROOT, else ~/mesh/prod
  #     The tree delightd monitors: the parent of the managed projects' git
  #     working trees. Read-only in the container deployments (git-state source).
  #     Left unset here on purpose so DELIGHT_INSTALL_ROOT can govern -- a fleet
  #     under /opt or /usr/local moves with that one variable.
  #   daemon_root   DELIGHT_DAEMON_ROOT   default ~/var
  #     delightd's own runtime/state tree (pid file, exports, the backups dir).
  #   backups_root  DELIGHT_BACKUPS_ROOT  default ${daemon_root}/backups
  #     The directory backup archives are written INTO -- the literal destination,
  #     one archive subtree per project. No "/backups" is appended to it. Left
  #     unset it derives from daemon_root; set it to relocate backups elsewhere.
  #   config_root   DELIGHT_CONFIG_ROOT   default ~/etc
  #     Where delightd resolves its configuration and registry.
  # monitor_root deliberately unset -- see the chain above.
  daemon_root: "~/var"
  # backups_root left unset -> derives to ~/var/backups (${daemon_root}/backups).
  config_root: "~/etc"
  daemon:
    control_port: 8088
    pid_file: "~/var/run/delightd.pid"

  # Agent skills. delightd aggregates each managed project's mcp.json into one
  # agent surface and regenerates it on a timer. Enabled, it exposes those tools
  # two ways: a CLI router written to ~/var/bin/delight, and an MCP endpoint at
  # POST /mcp. Left unset the daemon skips generation entirely -- the wrapper is
  # never written and /mcp stays unregistered -- so this must be set for the
  # skills to exist at all.
  agent_skills:
    enabled: true
    expose_via: ["cli", "mcp"]

  # Event emission: delight.v1 events onto the bus. This block is the committed
  # wiring of record and matches the fleet deployment -- the broker and
  # schema-registry names resolve on the compose network. Empty brokers =>
  # event publishing disabled and the daemon runs exactly as before; an
  # unreachable broker is fail-soft (a logged warning and a no-op publisher),
  # so backups never depend on Kafka being present.
  kafka:
    brokers:
      - "kafka:9092"
    schema_registry_url: "http://schema-registry:8081"
    topic: "delight.events"

# PATHS HERE ARE CONTAINER PATHS, NOT HOST PATHS. This is the single most
# important thing to know before editing this list.
#
# The daemon runs in a container that binds the estate read-only at /work
# (docker-compose.yml, DELIGHT_MONITOR_ROOT=/work). gitstate hands a project's
# `path` straight to the git reader -- it is never joined with MONITOR_ROOT --
# and the image sets no $HOME, so a `~/...` path expands to nothing that exists
# and a `/Users/jane/...` path is not visible from inside the container either.
#
# A wrong path here does NOT raise. gitstate reports missing_path and the
# project's state machine parks in `fallow`, which is the same state a genuinely
# quiet project sits in -- so /health stays green, error_count stays 0, and
# nothing is backed up. That is how paling went from 2026-07-05 to 2026-08-21
# with no checkpoints while every surface said fine (issues #139, #140).
#
# Write /work/<repo>. Nothing else resolves.
projects:
  - name: "paling"
    path: "/work/paling"
    # Roster fields delightd now owns (the seam in docs/fleet-and-delightd.md):
    # the project's tier and how fleet rolls it. paling is the bare-metal eel --
    # `paling serve` needs Metal/MLX and cannot be a pod, so it deploys through a
    # launchd agent (install reloads the plist onto current code). essential:false
    # -- it is an on-demand workload, not part of the cold-boot converge set.
    essential: false
    deploy:
      kind: launchd
      command: ["uv", "run", "paling", "launchagent", "install"]
    backup:
      check_interval: "15m"
      rotation:
        max_archives: 48

  # dodo, the front door. Ported from dodo's own deploy/dodo.delightd.yaml,
  # which authored this intent and then instructed installing it into
  # ~/etc/delightd/projects.d -- a directory this deployment never reads,
  # because config is baked into the image on purpose. So dodo has had no
  # backup story despite its drop-in claiming that oversight was fixed.
  #
  # essential: true, and dodo's file argues it well: a machine back from a
  # reboot has more urgent things to do than a shopping list, but the front
  # door is how a human FINDS everything else. One node process, no cluster
  # dependency, and the first thing worth having back precisely because it can
  # report on what is not.
  - name: "dodo"
    path: "/work/dodo"
    kind: listener
    essential: true
    backup:
      check_interval: "15m"
      rotation:
        max_archives: 48
      exclude:
        # Generated from ~/.oh-my-zsh by scripts/import-omz-themes.mjs, and
        # committed, so git already has it. No reason to carry it in every
        # archive as well.
        - lib/themes/omz.generated.css
        - lib/themes/omz.generated.mjs

  # kestrel: training. Ported from kestrel/deploy/kestrel.delightd.yaml.
  - name: "kestrel"
    path: "/work/kestrel"
    kind: listener
    essential: false
    backup:
      check_interval: "15m"
      rotation:
        max_archives: 48
      exclude:
        - lib/themes

  # albatross: the job search. No drop-in was ever authored for it, so this
  # entry is new rather than ported -- the shape follows kestrel, which is its
  # nearest neighbour (private repo, cluster Deployments, not part of the
  # cold-boot set).
  - name: "albatross"
    path: "/work/albatross"
    kind: listener
    essential: false
    backup:
      check_interval: "15m"
      rotation:
        max_archives: 48

  # NO deploy: BLOCK on any of the three above, and it is a schema limitation
  # rather than an oversight. Deploy in project.proto carries ONE kind and ONE
  # deployment string. kestrel produces two (athlete, explorer); albatross
  # produces two (jobs, resume); dodo produces zero, because its front door is
  # a host process on purpose. Naming one of a pair would be a lie by omission
  # and naming none is at least honest. Fixing it means widening the schema.
