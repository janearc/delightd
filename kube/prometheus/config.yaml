apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fleet
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: fleet
data:
  prometheus.yml: |
    # Scrape config for a ONE-NODE LAPTOP CLUSTER. Every number here is sized
    # for that and would be wrong for a real fleet.
    #
    # 30s interval, not 15s: this exists to answer "is the disk filling" and
    # "what is restarting", questions that move over minutes and hours. Halving
    # the interval doubles the series volume and the memory to hold it, and
    # buys resolution nobody will look at.
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      external_labels:
        cluster: fleet

    # OTLP INGESTION. Claude Code sessions push here rather than being scraped;
    # the receiver flag in deployment.yaml carries the reasoning.
    #
    # A RESOURCE attribute does not become a label unless it is named below.
    # That is the whole of what this list controls, and the distinction was
    # got wrong here.
    #
    # This block used to say user.email, user.id, user.account_uuid and
    # organization.id "ride on every metric the SDK emits, and are deliberately
    # NOT promoted". The first half is right and the second half does not
    # follow. Those four are DATAPOINT attributes, not resource attributes, so
    # this allow-list never had any say over them -- and they are all present
    # as labels on every claude_code_* series in the store right now, verified
    # 2026-08-21. Leaving them off the list achieved nothing.
    #
    # The cost argument was sound and still applies: each holds one value
    # forever on a single-operator estate, so they distinguish nothing and are
    # paid for on every sample. Dropping them needs a metric_relabel_configs
    # labeldrop on the OTLP path, not an omission here. Not done yet, and
    # written down rather than left as a comment that describes a filter that
    # does not exist.
    #
    # WHAT ACTUALLY BROKE THIS, for the next person: nothing arrived here for
    # weeks and every surface looked fine. Two faults, stacked. The endpoint
    # was set to .../api/v1/otlp -- but OTEL_EXPORTER_OTLP_METRICS_ENDPOINT is
    # the SIGNAL-SPECIFIC variable and is used verbatim; only the generic
    # OTEL_EXPORTER_OTLP_ENDPOINT gets /v1/metrics appended. Fixing that got a
    # 200 and STILL no series, because Claude Code exports DELTA temporality
    # and Prometheus stores cumulative only: it drops delta points silently
    # while still creating target_info from the resource. So the store showed a
    # healthy-looking claude-code target with nothing behind it. The client
    # needs OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE=cumulative.
    #
    # Both faults are the same shape as the four others found the same night: a
    # thing that was never populated, wearing the face of a thing that is fine.
    #
    # session.id IS promoted, and it is the one that earns its cardinality.
    # One Claude Code session is one judge invocation, so session.id is what
    # separates two rulings on the SAME pull request, and repeat rulings are
    # ordinary: PR 131 was judged twice on 2026-08-21. mesh.pr collapses those
    # into a single series; session.id keeps them apart. holden is the largest
    # consumer of the allotment, so breaking its usage out per run is the
    # point of this exercise rather than a nicety on top of it.
    #
    # mesh.* are ours, set through OTEL_RESOURCE_ATTRIBUTES by whatever spawns
    # the session, so a run can be attributed to the repo and PR it ruled on.
    otlp:
      promote_resource_attributes:
        - service.name
        - session.id
        - mesh.component
        - mesh.repo
        - mesh.pr
        - terminal.type

    # WHERE ALERTS GO. Without this block the rules below evaluate, fire, and
    # go nowhere: Prometheus records a firing alert and has nobody to hand it
    # to. Every rule in prometheus-rules was inert until this landed, which is
    # the quiet kind of broken -- the rules page shows red and no light comes
    # on.
    #
    # Routing is opt-in PER RULE via a nanoleaf label, not by severity, and the
    # split is not importance. NodeDiskFillingUp is deliberately unlit: it is
    # the early warning you want on a dashboard where you can look at it, not
    # on a lamp that interrupts you at 80% with five hours of room left. An
    # unlit alert is still recorded and still worth rendering. Do not read
    # "routed" as "the real ones".
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager.fleet.svc.cluster.local:9093']

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      # Prometheus itself. If this stops, nothing else is trustworthy either.
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      # THE NODE, and ONLY the node. Disk, memory, cpu, load for the k3d node
      # container. This is the job that would have caught the DiskPressure that
      # evicted 30 pods.
      #
      # This comment used to say "Host and node". It never measured the host.
      # node-exporter runs host-networked on the k3d node, whose "host" is the
      # colima VM -- 4 CPUs and 16GiB -- not the workstation, which has 16 cores
      # and 48GiB. Every dashboard built on this job is a VM dashboard.
      #
      # It is worse than incomplete on the virtiofs binds. Measured 2026-08-23:
      #
      #   node_filesystem_avail_bytes{mountpoint="/Users/jane/var"}
      #     node-exporter says  19,750,503,579,648   (19.75 TB)
      #     the mac's df says       77,006,356,480   (77 GB)
      #
      # virtiofs reports a fabricated size through the bind, so the 50GiB
      # free-space rule is not merely un-alerted here, it is UN-ALERTABLE on
      # this job. That is what the metricsd job below exists for.
      - job_name: node-exporter
        static_configs:
          - targets: ['node-exporter.fleet.svc.cluster.local:9100']

      # THE WORKSTATION. The layer node-exporter cannot see: real load, the
      # macOS memory breakdown (wired, compressed, the pressure level), swap,
      # and the actual free space behind the 50GiB rule.
      #
      # metricsd runs on the mac and cannot move -- reading sysctl and vm_stat
      # IS the job. It is SCRAPED, not pushed, which is the whole reason this
      # stanza has to exist: a pushing daemon would need no config here.
      #
      # It has no pod, so the annotation-based discovery below cannot reach it.
      # metricsd-host is a Service with no selector whose EndpointSlice names
      # 192.168.5.2:9847 -- the same shape dodo-host already uses to reach dodo
      # on the mac. 192.168.5.2 is colima's host alias; the docker bridge
      # gateway (172.21.0.1) is the VM and refuses, which reads like a firewall
      # and is really a wrong host. Manifest and the full probe live in
      # janearc/metrics, deploy/kube/metricsd-host.yaml.
      #
      # Reading it: alert on metricsd_collector_up, never on the absence of a
      # host series. The scheduler CLEARS a failed collector's gauges rather
      # than serving a stale value, so a failure is `up 0` plus absent series --
      # there is deliberately no number left behind to mistake for current.
      #
      # Mind the mountpoints. `/` and `/System/Volumes/Data` are one APFS
      # container, so they report identical size and avail; summing them claims
      # 1.99TB on a 1TB machine. Pin a mountpoint or take max().
      - job_name: metricsd
        static_configs:
          - targets: ['metricsd-host.fleet.svc.cluster.local:9847']

      # THE OBJECTS. Restarts, phases, evictions, deployment readiness.
      # kube_pod_container_status_restarts_total is the series that would have
      # named logstash's 88 OOMKills on day one instead of day 59.
      - job_name: kube-state-metrics
        static_configs:
          - targets: ['kube-state-metrics.fleet.svc.cluster.local:8080']

      # THE KUBELET. Per-container memory and cpu, and the cadvisor filesystem
      # series -- the closest thing to real per-volume usage this cluster has,
      # since local-path makes the kubelet's per-PVC stats report the node
      # filesystem identically for every claim.
      - job_name: kubelet
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      # THE ESTATE'S OWN SERVICES, opt-in by annotation. A pod carrying
      # prometheus.io/scrape: "true" is scraped; everything else is left alone.
      #
      # Opt-in rather than scrape-everything on purpose: most pods here serve
      # no metrics, and a scrape config that hammers every port in the namespace
      # generates noise, failed-target alerts, and load nobody asked for.
      #
      # This block used to claim dodo, albatross and kestrel "already emit the
      # exposition format from their health ports -- they need the annotation,
      # not new code". That was measured on 2026-08-21 and it is false. What is
      # actually served right now:
      #
      #   albatross :15001 /metrics  404   (jobs web, resident)
      #   albatross :15006 /metrics  404   (resume estate, resident)
      #   dodo      :15000 /metrics  the landing page HTML, not metrics
      #   dodo      :15090 /metrics  200, body EMPTY
      #
      # albatross's src/ports.ts claimed "the web interfaces serve their own on
      # their main port"; they did not. The exposition format existed only in
      # src/health.ts and only a CLI pass ever starts that server, so the
      # numbers lived for the length of a nightly run and vanished. The
      # annotation was necessary and it was never sufficient.
      #
      # SINCE FIXED on the resident half: albatross :15001 now serves the
      # market families from src/market.ts -- open postings, arrivals, posting
      # lifetime, demand by theme, ghost rate, reposting churn. So there is
      # finally something worth scraping.
      #
      # ALBATROSS IS DISCOVERED BY THIS JOB, as of 2026-08-21. Its jobs pane
      # runs as a pod carrying
      #
      #     prometheus.io/scrape: "true"
      #     prometheus.io/port:   "15001"
      #
      # so it needs no job of its own and this file knows nothing about it.
      #
      # It briefly did. For one day after being split out of dodo it ran as a
      # host process, collected by a static target at 192.168.5.2 -- the lima
      # host route, and the only address that crosses the VM boundary, since
      # host.k3d.internal does not resolve here and 172.21.0.1 is the docker
      # bridge gateway, the VM rather than the Mac. That target was argued
      # against on the grounds that a temporary address in a committed manifest
      # outlives its reason every time, added anyway because the operator ruled
      # the signal was worth more that night, and removed the same day once the
      # manifests existed. The obligation to delete it was written into three
      # places precisely so it would not be the counterexample to its own
      # argument.
      #
      # This paragraph is rewritten rather than appended to, because the
      # version it replaces said "no static target is added here, deliberately"
      # and "albatross has no kubernetes manifests yet" -- both true when
      # written, both false within a day, and a comment that reads as current
      # and is not is the fault this estate spent a whole session chasing.
      #
      # The batch half is different and stays different. A nightly is not at
      # any address when the scrape arrives, in the cluster or out of it, so
      # its counters -- including the Brave quota, cost and outcome series --
      # PUSH over OTLP at the end of the pass. Two halves, two deliveries; the
      # cluster move does not collapse them into one. See the otlp block above.
      - job_name: fleet-services
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # SURREALDB, AUTHENTICATED. The store is the glue under dodo, albatross
      # and kestrel, so "is it up" was never the question worth answering.
      #
      # /metrics is mounted by default (SURREAL_METRICS_ENABLED=true) but it
      # renders through an allow-list at request time, and an ANONYMOUS scraper
      # gets exactly six things: surrealdb_build_info, the three
      # surrealdb_process_* gauges, target_info and otel_scope_info. Process
      # vitals. Nothing about what the database is doing. Measured, not assumed
      # -- an unauthenticated scrape of this endpoint on 2026-08-21 returned
      # those and nothing else.
      #
      # Root credentials unlock the rest: statement, query, transaction, rpc,
      # auth, session, network, http, live_query, slow_query and storage. That
      # is the difference between a target that says surreal is running and one
      # that says a write took 400ms and three transactions conflicted.
      #
      # The credential is a FILE REFERENCE, never a value. Both keys come from
      # the operator-created surrealdb-credentials Secret -- the same Secret the
      # surrealdb Deployment already consumes via envFrom -- mounted read-only
      # into this pod by deployment.yaml. Nothing here, in git, or in any
      # manifest holds the secret itself.
      #
      # A trap worth naming because it has cost people days elsewhere: a
      # password_file whose contents carry a trailing newline used to
      # authenticate as a DIFFERENT string and fail with a 401 that looks like
      # a wrong password. Prometheus trims surrounding whitespace on both
      # _file values as of v2.x, and this cluster runs v3.1.0, so a Secret
      # written with or without a trailing newline works. Do not "fix" it by
      # stripping the newline in the Secret; that is not where the bug was.
      - job_name: surrealdb
        # in-cluster ClusterIP, not the surrealdb.localhost ingressroute: the
        # edge route exists for the workstation, and sending a scrape out to
        # traefik and back buys a second thing that can break between here and
        # a pod two hops away.
        static_configs:
          - targets: ['surrealdb.fleet.svc.cluster.local:8000']
        basic_auth:
          username_file: /etc/prometheus/secrets/surrealdb/SURREAL_USER
          password_file: /etc/prometheus/secrets/surrealdb/SURREAL_PASS
        metric_relabel_configs:
          # otel_scope_name rides on EVERY series surreal emits and is a
          # restatement of the metric name's own prefix --
          # surrealdb_statement_total is already the statement scope. One label
          # that adds nothing, on every sample of every series, on a node with
          # 11.65 GiB and a 5Gi TSDB.
          - action: labeldrop
            regex: otel_scope_name
          # `user` is on every labelled family and holds one value forever on a
          # single-operator estate. Same argument the otlp block above makes for
          # user.email and organization.id, applied to the pull side: a label
          # that never varies distinguishes nothing and costs storage always.
          # namespace and database are KEPT -- those genuinely vary as albatross
          # and kestrel take their own, and "which database is doing the writes"
          # is a question that gets asked.
          - action: labeldrop
            regex: user

      # TRAEFIK. Every request into this estate crosses it, and it has been
      # exporting Prometheus metrics since the cluster was built with nothing
      # collecting them. Per-route request rates, latencies and response codes,
      # produced and discarded for weeks.
      #
      # WHY THIS ONE IS DIFFERENT FROM EVERY OTHER TARGET HERE: the rest of the
      # estate tells you a service is UNHEALTHY. traefik is the only thing that
      # tells you someone TRIED TO REACH one and what happened to them. A .mesh
      # name that does not resolve, an IngressRoute pointing at a service that
      # no longer exists, a backend that started refusing -- none of those show
      # up as an unhealthy pod, because the pod is fine and the request never
      # arrives. grafana was unreachable for 59 days behind exactly that blind
      # spot.
      #
      # POD DISCOVERY, NOT A STATIC TARGET, and this is the part that catches
      # people. traefik's Service exposes only web:80 and websecure:443 --
      # measured -- so a static target at the ClusterIP cannot reach 9100 at
      # all. Two sessions independently checked that the metrics entrypoint
      # existed and neither checked whether the Service published it. The port
      # is on the POD, so the pod is what gets discovered.
      #
      # Kept to kube-system rather than discovering cluster-wide: this job wants
      # exactly one workload, and a namespace filter is cheaper than asking the
      # apiserver for every pod in the cluster and throwing nearly all of them
      # away.
      #
      # Filtered on the container port NAME rather than the number. role: pod
      # yields one target per declared container port -- traefik declares four
      # (metrics 9100, traefik 8080, web 8000, websecure 8443) -- so without
      # this the job scrapes all four and three of them fail forever. The name
      # also survives the chart renumbering the port, which a hardcoded 9100
      # would not.
      - job_name: traefik
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['kube-system']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: traefik
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
        metric_relabel_configs:
          # traefik emits a full Go runtime surface -- goroutines, GC pauses,
          # every heap bucket -- on top of the routing metrics. On a laptop
          # TSDB with a 5Gi claim that is a lot of series describing the
          # ingress's garbage collector, which nobody has ever needed. The
          # routing signal is what this job exists for.
          - source_labels: [__name__]
            action: drop
            regex: 'go_.*|process_.*|promhttp_.*'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: fleet
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: fleet
data:
  fleet.yml: |
    # Rules named for the three faults that actually happened on 2026-08-20,
    # every one of which was found by a human squinting at a list rather than
    # by anything telling them.
    #
    # NO PAGER. These fire into Prometheus and Grafana, which is the right
    # ceiling for a personal estate: the alert surface is the thing the
    # operator already looks at, not a phone call at 03:20.
    groups:
      - name: fleet
        rules:
          # The one that evicted 30 pods. 85% is where the kubelet starts
          # evicting by default, so 80% is a warning with room to act.
          #
          # The mountpoint is /var/lib/rancher/k3s and NOT "/", which is not a
          # detail. node-exporter runs in a container: it never sees a mount
          # called "/" for the node's disk, and reports that filesystem under
          # whichever bind mounts exist -- /etc/hosts, /etc/hostname,
          # /var/lib/kubelet, /var/lib/rancher/k3s -- all the same 52.5GB ext4
          # device. A rule written against "/" matches NOTHING and fires never,
          # which is the worst failure an alert can have: it looks configured
          # and stays silent. The first version of this file had exactly that
          # bug and it was caught by querying, not by reading.
          #
          # This mountpoint is also the semantically honest one: local-path
          # PVCs and container storage both live under it, so it is genuinely
          # the thing that fills.
          # THE DISK LADDER. Three rules, one signal, rising urgency -- because
          # the light for disk is a throb that speeds up as pressure rises, and
          # an Alertmanager label is a static string. A value that changes
          # cannot ride in a label without minting a new alert for every new
          # value, so the ramp is expressed as BUCKETS instead. Operator
          # ruling, 2026-08-21.
          #
          # Only one lights at a time. The overlap is resolved by inhibit_rules
          # in alertmanager.yaml rather than by PromQL gymnastics here: a node
          # at 95% under DiskPressure genuinely satisfies all three, and three
          # effects arriving at once would fight over the same panels.
          - alert: NodeDiskFillingUp
            expr: |
              100 - ((node_filesystem_avail_bytes{mountpoint="/var/lib/rancher/k3s"} * 100)
                     / node_filesystem_size_bytes{mountpoint="/var/lib/rancher/k3s"}) > 80
            for: 10m
            labels: { severity: warning, nanoleaf: "true", nanoleaf_effect: "disk-throb-slow" }
            annotations:
              summary: "node disk above 80% -- eviction starts at 85%"

          - alert: NodeDiskFillingFast
            expr: |
              100 - ((node_filesystem_avail_bytes{mountpoint="/var/lib/rancher/k3s"} * 100)
                     / node_filesystem_size_bytes{mountpoint="/var/lib/rancher/k3s"}) > 90
            for: 5m
            labels: { severity: warning, nanoleaf: "true", nanoleaf_effect: "disk-throb-medium" }
            annotations:
              summary: "node disk above 90% -- past the eviction threshold, pods are at risk"

          # THE WORKSTATION LADDER. The ladder above is about the k3d node and
          # its eviction thresholds. These are about the laptop, and until the
          # metricsd job existed there was no series that could express them:
          # node-exporter reads 19.75TB free through the virtiofs bind against
          # the mac's real 77GB, so the 50GiB rule was un-alertable, not merely
          # un-alerted.
          #
          # NO nanoleaf LABELS HERE, and that is the documented default rather
          # than an omission. docs/nanoleaf-alert-seam.md: "Routing is opt-in
          # per rule, not severity-based... Adding a new alert rule does not add
          # a light; someone has to decide it earned one," and "If everything
          # lights it up, nothing does." Unlabelled alerts route to the
          # blackhole receiver and stay fully visible in Prometheus and Grafana
          # -- not routed is not the same as not recorded.
          #
          # There is a second reason specific to these three. The effect
          # vocabulary and the inhibit_rules in alertmanager.yaml are built
          # around the node ladder; putting a second, unrelated disk on the same
          # effect would have two machines fighting over one panel, which is the
          # exact failure the ladder's own comment says the buckets exist to
          # avoid. Which effect the workstation gets -- if any -- is the
          # operator's to decide, and it wants an inhibit rule written with it.
          #
          # max() collapses the APFS double-count: `/` and
          # `/System/Volumes/Data` are one container reporting identical
          # figures, so without it this fires twice for one physical condition.
          - alert: WorkstationDiskBelowFloor
            expr: max(host_disk_free_below_floor) == 1
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "the workstation is at or under the 50GiB free-space floor"

          # 1 normal, 2 warn, 4 critical. This is the macOS compressor telling
          # you it is working, which shows up long before swap does.
          - alert: WorkstationMemoryPressure
            expr: max(host_memory_pressure_level) > 1
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "macOS memory pressure above normal on the workstation"

          # THE ONE THAT MAKES THE REST TRUSTWORTHY. metricsd clears a failed
          # collector's gauges rather than serving a stale value, so a failure
          # is `up 0` plus ABSENT host series -- there is no number left behind
          # to mistake for current. That is only a safety property if something
          # watches the mark. Alert on this, never on a host series going away.
          #
          # `absent()` is the second arm on purpose: up == 0 covers a collector
          # that ran and failed, absent() covers the whole target being
          # unreachable -- the daemon stopped, or the hand-written EndpointSlice
          # behind metricsd-host stopped pointing anywhere. Nothing repairs that
          # slice; there is no controller behind it.
          - alert: MetricsdNotCollecting
            expr: |
              max(metricsd_collector_up) == 0 or absent(metricsd_collector_up)
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "metricsd is not collecting -- host metrics are absent, not zero"

          # The one that hid behind a 1/1 for 59 days. Rate, not total: a pod
          # with 88 lifetime restarts that is now stable should not alert
          # forever, and one restarting three times an hour should.
          - alert: PodRestartingRepeatedly
            expr: increase(kube_pod_container_status_restarts_total[1h]) > 3
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarted more than 3 times in an hour"

          # Names the CAUSE rather than the symptom. logstash's restarts were
          # visible; that they were OOMKills was not, and that was the whole
          # diagnosis.
          # nanoleaf: "true" -- one of exactly TWO rules that reach the lights.
          # See alertmanager.yaml. Routing is opt-in per rule on purpose: if
          # everything lights it up, nothing does.
          - alert: ContainerOOMKilled
            expr: increase(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[30m]) > 0
            labels: { severity: warning, nanoleaf: "true", nanoleaf_effect: "oom-bounce" }
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled -- its limit is too low for its real footprint"

          # THE OTHER LIGHT. This is the kubelet's own DiskPressure condition,
          # not a threshold we picked -- it is the literal signal that evicted
          # 30 pods on 2026-08-20, reported by the component that made the
          # decision. NodeDiskFillingUp above is the early warning at 80%; this
          # is "it is happening now", which is why this one earns a light and
          # the warning does not.
          #
          # Verified against the live store rather than assumed: this series
          # exists (3 of them, one per node condition). Two rules in this file
          # were written against series that never existed -- one matched
          # mountpoint="/" which node-exporter never reports in a container,
          # and ContainerWithoutMemoryLimit is written as `== 0`, which matches
          # nothing because an unlimited container emits no series at all
          # (issue #137, still open). A rule nobody queried is a rule nobody
          # knows is dead.
          - alert: NodeUnderDiskPressure
            expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
            for: 2m
            labels: { severity: critical, nanoleaf: "true", nanoleaf_effect: "disk-throb-fast" }
            annotations:
              summary: "node {{ $labels.node }} is under DiskPressure -- the kubelet is evicting pods"

          # A pod that should be running and is not. Deliberately excludes
          # Succeeded and Failed, because a finished pod is not a sick one --
          # three completed pods from July read as a broken delightd.
          - alert: PodNotReady
            expr: kube_pod_status_ready{condition="false"} * on(pod, namespace)
                  group_left kube_pod_status_phase{phase="Running"} > 0
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} has been not-ready for 15 minutes"

          # The exposure the judge flagged: a container with no limit can take
          # the whole node, where a bounded one merely dies.
          - alert: ContainerWithoutMemoryLimit
            expr: count(kube_pod_container_resource_limits{resource="memory"} == 0)
                  or count(kube_pod_container_info) - count(kube_pod_container_resource_limits{resource="memory"}) > 0
            for: 1h
            labels: { severity: info }
            annotations:
              summary: "containers are running with no memory limit -- unbounded, they can take the node"
