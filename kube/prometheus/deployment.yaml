apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: fleet
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: fleet
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # 5Gi against 7 days of retention on a one-node cluster with a few dozen
      # pods. The series count here is small; the risk is not volume, it is
      # forgetting that this claim shares the node's 48.9G with everything
      # else -- which is the disk that filled and evicted 30 pods.
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: fleet
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: fleet
spec:
  replicas: 1
  # Recreate: the TSDB is ReadWriteOnce and two Prometheus processes must never
  # hold the same data directory. A rolling update would either deadlock on the
  # claim or, worse, corrupt it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: fleet
    spec:
      serviceAccountName: prometheus
      # The TSDB is written by uid 65534 in the upstream image; local-path
      # creates the directory owned by root, so without this the process cannot
      # write and crash-loops on startup with a permissions error that reads
      # like a config fault.
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsNonRoot: true
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          imagePullPolicy: IfNotPresent
          args:
            # /conf, not /etc/prometheus directly: see the volumeMounts note.
            - --config.file=/etc/prometheus/conf/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # TWENTY-EIGHT DAYS, the operator's ruling of 2026-08-22. Seven was
            # long enough to see a trend and not long enough to see a WEEK --
            # a store that forgets on day eight cannot answer "what does
            # Tuesday look like", and periodicity by day-of-week and hour has
            # historically mattered in this estate. Four weeks shows four
            # Tuesdays.
            #
            # Sized against the claim, not guessed: seven days of this
            # cluster's series was 212MB on disk at the time of the change, so
            # 28 days is under 1GiB against the 5Gi claim above. The TSDB
            # still cannot quietly become the thing that fills the disk it is
            # watching. Raise the claim before going past ~120 days at today's
            # series count, and re-measure if the series count grows.
            - --storage.tsdb.retention.time=28d
            - --web.enable-lifecycle
            # PUSH, alongside the pull. Everything else here is scraped, which
            # works because everything else is a resident process at a stable
            # address. Claude Code sessions are neither: they start, run for
            # minutes, and exit, and several run at once. A scrape target that
            # is gone by the time you scrape it reports nothing, and the
            # Prometheus exporter each session would otherwise bind collides
            # on one port the moment a second session starts.
            #
            # So those sessions PUSH over OTLP and Prometheus receives on
            # /api/v1/otlp/v1/metrics. No collector in between: the collector
            # image is a quarter of a gigabyte and this VM hit DiskPressure
            # today, so the receiver Prometheus already ships is the cheaper
            # correct answer. See the otlp block in prometheus.yml for which
            # resource attributes become labels, and which deliberately do not.
            - --web.enable-otlp-receiver
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            # NOT subPath, and this is the whole point of the change. A
            # ConfigMap mounted with subPath NEVER receives updates -- the file
            # is frozen at pod start. So `kubectl apply` on the ConfigMap
            # changes nothing inside the pod, and POST /-/reload cheerfully
            # re-reads the same stale file and answers 200. The operator gets a
            # success response and no new behaviour, which is the worst way for
            # a config change to fail. Mounted as a DIRECTORY the kubelet keeps
            # it in sync, which is what makes --web.enable-lifecycle mean
            # anything at all.
            #
            # Its own subdirectory rather than /etc/prometheus, because `rules`
            # already mounts at /etc/prometheus/rules; nesting one mount inside
            # another works but is a second trap for whoever edits this next.
            - name: config
              mountPath: /etc/prometheus/conf
            - name: rules
              mountPath: /etc/prometheus/rules
            # The surrealdb root credential, as FILES for the surrealdb scrape
            # job's basic_auth username_file/password_file. Read-only, and the
            # value never appears in a manifest, an argument list or an env var
            # on this pod -- the Secret is operator-created and this is a
            # reference to it.
            #
            # A projected Secret volume, not envFrom: an env var is visible in
            # `kubectl describe pod` and in /proc/1/environ to anything that
            # gets a shell here, and prometheus.yml cannot read env vars anyway
            # -- it has no expansion, which is exactly why the _file variants
            # exist. defaultMode 0400 because uid 65534 is the only reader.
            - name: surrealdb-credentials
              mountPath: /etc/prometheus/secrets/surrealdb
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              # Prometheus is Go, so there is no heap-versus-footprint trap
              # here the way there was with Logstash -- but memory still scales
              # with active series, and this node has 11.65 GiB total. 1Gi is
              # generous for a few dozen pods at 30s and bounded so it cannot
              # take the node while watching it.
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: rules
          configMap: { name: prometheus-rules }
        # optional: false is deliberate. If the Secret is missing this pod must
        # refuse to start and say so, rather than come up healthy with a
        # surrealdb target that 401s forever -- a scrape job that authenticates
        # with nothing looks identical to one that is merely broken, and the
        # whole point of this job is the metrics you only get when authed.
        - name: surrealdb-credentials
          secret:
            secretName: surrealdb-credentials
            defaultMode: 0400
            optional: false
            items:
              - key: SURREAL_USER
                path: SURREAL_USER
              - key: SURREAL_PASS
                path: SURREAL_PASS
        - name: data
          persistentVolumeClaim: { claimName: prometheus-data }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: fleet
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: fleet
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
