apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Aggregates the per-piece kustomizations under kube/. Each subdirectory
# (kube/delightd, and others as they are added) is a self-contained kustomization
# for one workload; listing its directory name below includes it in a
# whole-environment build. Each subdir owns its own namespace and labels.
#   kubectl kustomize kube/            renders every piece
#   kubectl kustomize kube/<piece>/    renders one piece in isolation
# To add a piece: create kube/<piece>/ with its manifests + kustomization, then
# add <piece> to the resources list here. Every entry MUST be a piece DIRECTORY:
# furnish reads this list (cmd/delightd/furnish.go pieces()) and runs
# `kubectl -k kube/<entry>` per entry, so a bare file here would break
# furnish health/up/down.
#
# The fleet Namespace is deliberately NOT owned here. furnish is per-piece with no
# ordering, so folding a shared namespace into any piece makes `furnish down` of
# that piece cascade-delete the whole fleet, and out-of-order `furnish up` of
# another piece fail for want of the namespace. Namespace provisioning is a
# cold-bring-up concern (runbook / tier0 work), tracked separately.

resources:
  - delightd
  - surrealdb
  - kafka
  - zookeeper
  - schema-registry
  - elasticsearch
  - kibana
  - logstash
  - grafana
