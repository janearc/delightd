apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The furniture aggregator. One directory per piece under kube/ -- delightd's
# own workload and, as they move in, the third-party furniture it depends on
# (see meubilair.yaml). This root builds them all; each subdir owns its own
# namespace, labels, and resources. `-k kube/` rolls the whole environment;
# `-k kube/<piece>/` targets one. Adding a piece is adding its dir here, nothing
# hand-wired -- the shape a future `furnish` step iterates.

resources:
  - delightd
