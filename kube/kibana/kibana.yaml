# Kibana -- the query/visualization UI over Elasticsearch (the "K" in ELK).
#
# Stateless: all state lives in ES (Kibana stores its own saved objects in a
# .kibana index). So a plain single-replica Deployment, no volumes -- it can die
# and reschedule freely. It is the one ELK component with an edge surface, so it
# gets a traefik IngressRoute (kibana.local), the same one-edge model as
# obs-svc-agg: cloudflared -> traefik (web :80) -> kibana Service:5601.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: fleet
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
        app.kubernetes.io/part-of: fleet
    spec:
      enableServiceLinks: false
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.15.3
          imagePullPolicy: IfNotPresent
          env:
            # in-cluster ES address. http (not https) because xpack.security is
            # off on ES -- see elasticsearch.yaml header.
            - name: ELASTICSEARCH_HOSTS
              value: http://elasticsearch:9200
            # bind all interfaces so the Service can reach the container; the
            # image defaults to localhost-only otherwise.
            - name: SERVER_HOST
              value: "0.0.0.0"
            # public base path is set at the edge, not here; serve at root.
            - name: SERVER_PUBLICBASEURL
              value: http://kibana.local
          ports:
            - name: http
              containerPort: 5601
          # readiness: /api/status returns 200 only when Kibana has connected to
          # ES and finished its own migrations. Kibana boot is genuinely slow
          # (node + plugin init + ES handshake), hence the long initialDelay and
          # high failureThreshold -- keep it OUT of rotation while it warms, not
          # restarted.
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: fleet
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: fleet
spec:
  selector:
    app.kubernetes.io/name: kibana
  ports:
    - name: http
      port: 5601
      targetPort: 5601
---
# Edge route. Authored to the shared shape in
# ~/work/traefik/kube/ingressroute-template.yaml: traefik v3 CRD group, the
# `web` entrypoint only (TLS terminates at the edge; the tunnel forwards
# cleartext), a single identity-safe Host rule, passHostHeader on.
apiVersion: traefik.io/v1alpha1   # traefik v3 CRD group (k3s v1.35.x). NOT containo.us (v2).
kind: IngressRoute
metadata:
  name: kibana
  namespace: fleet
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: fleet
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      # Identity-safe internal hostname; the real public hostname Cloudflare
      # Access fronts is set at cloudflared/go-live, not baked in here.
      match: Host(`kibana.local`)
      services:
        - kind: Service
          name: kibana
          port: 5601
          passHostHeader: true
