# Grafana -- the dashboard layer on top of the ELK store.
#
# Grafana reads Elasticsearch as a datasource and renders dashboards over the
# fleet-logs-* indices. It is a separate query/visualization surface from Kibana:
# Kibana is the Elastic-native explorer; Grafana is the fleet's general dashboard
# tool (and the same place fleet metrics dashboards will live).
#
# Trust model: same as the rest of the stack. Anonymous access with the Admin
# role, login form disabled -- no credential stored, because the trust boundary
# is the edge (Cloudflare Access in front of cloudflared), not the data plane.
# This mirrors xpack.security being off on Elasticsearch. Real Grafana auth is
# the same deferred, separate change as ES/kafka auth, not an omission here.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: fleet
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: fleet
data:
  # Provisioned at startup so the ES datasource exists with no manual click-ops.
  # index pattern + timeField match the Logstash output (fleet-logs-%{+YYYY.MM.dd}
  # in logstash.yaml); @timestamp is the field Logstash/Beats stamp by default.
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # Prometheus is DEFAULT, and Elasticsearch is not, because the questions
      # this estate actually needs answered are metric-shaped: how full is the
      # disk, what is restarting, what got OOMKilled. On 2026-08-20 all three
      # of those were found by a human reading a pod list, because grafana's
      # only datasource was an ES index pattern that has never existed --
      # fleet-logs-* is created by Logstash, and Logstash has never indexed a
      # document. A dashboard pointed at an empty store looks like working
      # observability and is not.
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        jsonData:
          timeInterval: "30s"
      # Kept, not default. It becomes useful the moment something feeds it --
      # either Logstash gets an input or obs-svc-agg keeps carrying kafka to
      # ES. Until then it is an honest empty source rather than a broken one.
      - name: Elasticsearch
        type: elasticsearch
        access: proxy
        url: http://elasticsearch:9200
        isDefault: false
        jsonData:
          index: "fleet-logs-*"
          timeField: "@timestamp"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: fleet
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: fleet
spec:
  # small dynamic local-path volume so user-created dashboards survive a restart
  # (provisioned datasources re-apply on boot regardless).
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: fleet
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: fleet
    spec:
      # grafana image runs as uid 472; make the local-path data volume writable.
      securityContext:
        fsGroup: 472
      enableServiceLinks: false
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          imagePullPolicy: IfNotPresent
          env:
            # anonymous Admin + no login form -- see header trust-model note.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            # served at root behind the edge route.
            - name: GF_SERVER_ROOT_URL
              value: http://grafana.localhost:8800
            # Allow the dodo admin pane to embed panels in an iframe. Grafana
            # sends X-Frame-Options: deny by default, which silently blanks an
            # embed -- the page loads, the frame is empty, and nothing says
            # why. Safe here only BECAUSE anonymous access is already the
            # trust model (see the header): embedding grants no capability
            # that visiting the URL did not already grant.
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
          ports:
            - name: http
              containerPort: 3000
          # /api/health returns 200 with {"database":"ok"} once Grafana is serving.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            # Dashboards as FILES, not click-ops. The provider config tells
            # grafana where to look; the JSON beside it is the view. Both are
            # ConfigMaps, so a cluster rebuilt from git comes back with the
            # same panels instead of an empty folder.
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboard-fleet
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: fleet
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: fleet
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: traefik.io/v1alpha1   # traefik v3 CRD group (k3s v1.35.x). NOT containo.us (v2).
kind: IngressRoute
metadata:
  name: grafana
  namespace: fleet
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: fleet
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      # Identity-safe internal hostname; the real public hostname is set at
      # cloudflared/go-live, not baked in here.
      match: Host(`grafana.localhost`) || Host(`grafana.local`) || Host(`grafana.mesh`)
      services:
        - kind: Service
          name: grafana
          port: 3000
          passHostHeader: true
