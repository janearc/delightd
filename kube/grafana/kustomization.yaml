apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fleet

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: fleet

resources:
  - grafana.yaml

# Relocated from obs-svc (kube/elk/grafana.yaml) so delightd owns the manifest
# ahead of obs-svc's sunset (T9). Manifest kept verbatim -- it carries its edge
# IngressRoute and 1Gi local-path PVC as-is; bring-current (reviewing those
# configs) is the follow-on.
