# Dashboards, provisioned as code.
#
# Clicked-together dashboards do not survive a rebuild, cannot be reviewed, and
# have no history. These are files: they land with the manifest, they diff, and
# a cluster rebuilt from git comes back with the same views.
#
# The panels are chosen from what actually went wrong on 2026-08-20 rather than
# from what a dashboard usually shows. Every row here answers a question that
# was asked by a human squinting at a pod list that day.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: fleet
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: fleet
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: fleet
        orgId: 1
        folder: fleet
        type: file
        disableDeletion: false
        # allow edits in the UI, but the file is the source of truth and wins
        # on every restart. Experiment freely; commit what you want to keep.
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-fleet
  namespace: fleet
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: fleet
data:
  fleet.json: |
    {
      "uid": "fleet-overview",
      "title": "fleet overview",
      "tags": ["fleet"],
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "type": "gauge",
          "id": 1,
          "title": "node disk used",
          "description": "The 52.5GB ext4 the whole cluster shares. Kubelet evicts at 85% -- that is what took 30 pods out. Mountpoint is /var/lib/rancher/k3s, not /, because node-exporter runs in a container and never sees a mount called / for the node disk.",
          "gridPos": { "h": 7, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 70 },
                { "color": "red", "value": 85 }
              ]}
            }
          },
          "targets": [{
            "expr": "100 - ((node_filesystem_avail_bytes{mountpoint=\"/var/lib/rancher/k3s\"} * 100) / node_filesystem_size_bytes{mountpoint=\"/var/lib/rancher/k3s\"})",
            "refId": "A"
          }]
        },
        {
          "type": "gauge",
          "id": 2,
          "title": "node memory used",
          "description": "11.65 GiB allocatable, which is far less than the Mac's memory and is the number that actually constrains limits.",
          "gridPos": { "h": 7, "w": 6, "x": 6, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 75 },
                { "color": "red", "value": 90 }
              ]}
            }
          },
          "targets": [{
            "expr": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))",
            "refId": "A"
          }]
        },
        {
          "type": "stat",
          "id": 3,
          "title": "containers with NO memory limit",
          "description": "An unbounded container can take the whole node; a bounded one merely dies. This is the node's real exposure -- logstash was bounded and visibly OOMKilling, which is the safe failure.",
          "gridPos": { "h": 7, "w": 6, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": { "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null }, { "color": "orange", "value": 1 }
            ]}}
          },
          "targets": [{
            "expr": "count(kube_pod_container_info) - count(kube_pod_container_resource_limits{resource=\"memory\"})",
            "refId": "A"
          }]
        },
        {
          "type": "stat",
          "id": 4,
          "title": "topics producing into the void",
          "description": "hall-monitor's absence ledger. A producer with zero live consumer groups is refusal-class: the mesh once ran a week like this with every artifact gate green, which is why hm exists. It emitted this metric for 116 ticks before anything scraped it.",
          "gridPos": { "h": 7, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": {
            "defaults": { "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null }, { "color": "red", "value": 1 }
            ]}}
          },
          "targets": [{ "expr": "count(hm_void_topics_total)", "refId": "A" }]
        },
        {
          "type": "timeseries",
          "id": 5,
          "title": "container restarts (1h rate)",
          "description": "Rate, not lifetime total. logstash sat at 88 lifetime restarts behind a green 1/1 for 59 days -- a total would alarm forever after a pod recovers, and a rate says what is wrong NOW.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 7 },
          "targets": [{
            "expr": "increase(kube_pod_container_status_restarts_total[1h]) > 0",
            "legendFormat": "{{namespace}}/{{pod}}",
            "refId": "A"
          }]
        },
        {
          "type": "timeseries",
          "id": 6,
          "title": "memory by pod",
          "description": "Working set per pod. Watch for a pod climbing toward its limit rather than sitting under it -- that is the shape of the next OOMKill.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 7 },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [{
            "expr": "topk(10, sum by (pod) (container_memory_working_set_bytes{pod!=\"\"}))",
            "legendFormat": "{{pod}}",
            "refId": "A"
          }]
        },
        {
          "type": "timeseries",
          "id": 7,
          "title": "hall-monitor: records seen per topic",
          "description": "What is actually crossing the wire. hm reads the broker's own metadata, so this is observed traffic rather than what a service claims to publish.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 },
          "targets": [{
            "expr": "increase(hm_records_total[5m])",
            "legendFormat": "{{topic}}",
            "refId": "A"
          }]
        },
        {
          "type": "timeseries",
          "id": 8,
          "title": "node disk free",
          "description": "The absolute number, beside the percentage gauge. A percentage hides how much room is actually left when the denominator is only 52.5GB.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [{
            "expr": "node_filesystem_avail_bytes{mountpoint=\"/var/lib/rancher/k3s\"}",
            "legendFormat": "free",
            "refId": "A"
          }]
        }
      ]
    }
  surrealdb.json: |
    {
      "uid": "surrealdb",
      "title": "surrealdb",
      "tags": ["fleet", "surrealdb"],
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "type": "stat",
          "id": 1,
          "title": "scrape authenticated",
          "description": "The panel to read FIRST, and the reason this dashboard exists. surrealdb answers /metrics to anyone, but renders through an allow-list: an anonymous scraper gets six process gauges and nothing about what the database is doing. Every other panel here needs the root credential. This checks for a family that only appears when authed -- 0 means the credential is working, 1 means the scrape is up but blind and every panel below it is empty for that reason and not because the store is idle.",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "authenticated", "color": "green" } } },
                { "type": "value", "options": { "1": { "text": "ANONYMOUS -- blind", "color": "red" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null }, { "color": "red", "value": 1 }
              ]}
            }
          },
          "targets": [{ "expr": "absent(surrealdb_query_total) or vector(0)", "refId": "A" }]
        },
        {
          "type": "stat",
          "id": 2,
          "title": "store reachable",
          "description": "up for the surrealdb job. Note this goes to 0 on a 401 as well as on a refused connection -- a bad credential and a dead store look identical here, which is what the panel to the left disambiguates.",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "1": { "text": "up", "color": "green" } } },
                { "type": "value", "options": { "0": { "text": "DOWN or 401", "color": "red" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null }, { "color": "green", "value": 1 }
              ]}
            }
          },
          "targets": [{ "expr": "up{job=\"surrealdb\"}", "refId": "A" }]
        },
        {
          "type": "stat",
          "id": 3,
          "title": "resident memory",
          "description": "Available anonymously, so this one survives a broken credential. Worth watching on its own terms: the store was holding 1.79GB of an 11.65 GiB node in August 2026, which makes it one of the largest single consumers on the machine it is the glue for.",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [{ "expr": "surrealdb_process_memory_bytes", "refId": "A" }]
        },
        {
          "type": "stat",
          "id": 4,
          "title": "uptime",
          "description": "Seconds since the surreal process started. A reset here that nobody ordered is the first thing to check when a pane starts throwing NotAllowed -- signin tokens do not survive a restart the way a pane assumes they do.",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [{ "expr": "surrealdb_process_uptime_seconds", "refId": "A" }]
        },
        {
          "type": "timeseries",
          "id": 5,
          "title": "queries per second, by outcome",
          "description": "The standing policy is that anything remote is counted and labelled by outcome; this is that view for the store everything else depends on. A failure line that is flat at zero and then is not is the shape worth catching -- errors here surface as broken panes several layers up, where the cause is invisible.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [{
            "expr": "sum by (outcome) (rate(surrealdb_query_total[5m]))",
            "legendFormat": "{{outcome}}",
            "refId": "A"
          }]
        },
        {
          "type": "timeseries",
          "id": 6,
          "title": "query latency, p50 / p95 / p99",
          "description": "Three quantiles rather than an average, because an average over a store that serves both a pane's point lookup and a nightly's bulk write tells you about neither. Watch p99 against p50: they separate when something started doing table scans.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum by (le) (rate(surrealdb_query_duration_seconds_bucket[5m])))", "legendFormat": "p50", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum by (le) (rate(surrealdb_query_duration_seconds_bucket[5m])))", "legendFormat": "p95", "refId": "B" },
            { "expr": "histogram_quantile(0.99, sum by (le) (rate(surrealdb_query_duration_seconds_bucket[5m])))", "legendFormat": "p99", "refId": "C" }
          ]
        },
        {
          "type": "timeseries",
          "id": 7,
          "title": "statements per second, by type",
          "description": "SELECT against CREATE/UPDATE/DELETE. This is how you tell a nightly harvest apart from someone reading a pane, without asking either of them.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [{
            "expr": "sum by (statement_type) (rate(surrealdb_statement_total[5m]))",
            "legendFormat": "{{statement_type}}",
            "refId": "A"
          }]
        },
        {
          "type": "timeseries",
          "id": 8,
          "title": "transactions per second, read against write",
          "description": "The write line is the one that matters for durability: it is what a backup has to be consistent with, and what a Recreate rollout interrupts. write=\"true\" is a mutating transaction.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [{
            "expr": "sum by (write, outcome) (rate(surrealdb_transaction_total[5m]))",
            "legendFormat": "write={{write}} {{outcome}}",
            "refId": "A"
          }]
        },
        {
          "type": "timeseries",
          "id": 9,
          "title": "transaction conflicts",
          "description": "Two writers touching the same keys. On a single-operator estate this should be near zero, so anything sustained means two things are writing the same rows -- the nightly running beside a manual pass is the usual cause, and it is a correctness question rather than a performance one.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 22 },
          "fieldConfig": {
            "defaults": { "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null }, { "color": "orange", "value": 1 }
            ]}}
          },
          "targets": [{
            "expr": "sum by (namespace, database) (increase(surrealdb_transaction_conflicts_total[1h]))",
            "legendFormat": "{{namespace}}/{{database}}",
            "refId": "A"
          }]
        },
        {
          "type": "timeseries",
          "id": 10,
          "title": "bytes read and written",
          "description": "Physical traffic through the rocksdb layer, which is the closest thing to \"is the store growing\" that surreal reports about itself. It is NOT the same question as how many rows exist -- surreal has no metric for that, which is what the logical-growth exporter is for.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 22 },
          "fieldConfig": { "defaults": { "unit": "Bps" } },
          "targets": [
            { "expr": "sum(rate(surrealdb_transaction_value_bytes_read_bytes_total[5m]))", "legendFormat": "values read", "refId": "A" },
            { "expr": "sum(rate(surrealdb_transaction_value_bytes_written_bytes_total[5m]))", "legendFormat": "values written", "refId": "B" },
            { "expr": "sum(rate(surrealdb_transaction_key_bytes_read_bytes_total[5m]))", "legendFormat": "keys read", "refId": "C" }
          ]
        },
        {
          "type": "timeseries",
          "id": 11,
          "title": "HTTP by route and status",
          "description": "Which endpoints the panes actually use, and what they get back. dodo and albatross both talk HTTP rather than WebSocket -- node 20 ships no global WebSocket -- so effectively all pane traffic appears here rather than under the rpc family.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 30 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [{
            "expr": "sum by (http_route, http_response_status_code) (rate(surrealdb_http_request_total[5m]))",
            "legendFormat": "{{http_route}} {{http_response_status_code}}",
            "refId": "A"
          }]
        },
        {
          "type": "timeseries",
          "id": 12,
          "title": "store growth: keys held, and live data on disk",
          "description": "The closest thing surreal reports to LOGICAL growth. estimate_num_keys is rocksdb's own count of keys held -- not rows, since one record spans several keys, but it moves with the estate rather than with process memory, and it is the only native series that does. Beside it, the live data size after compaction.\n\nThis panel replaced an active-sessions panel written from the published metrics catalogue: surrealdb_session_active does not exist in 3.2.0. The whole session family is absent from what this server actually renders, which is why every panel here was re-checked against a live scrape rather than against the documentation.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 30 },
          "fieldConfig": { "defaults": { "custom": { "axisPlacement": "auto" } } },
          "targets": [
            { "expr": "surrealdb_storage_rocksdb_estimate_num_keys", "legendFormat": "keys held (estimate)", "refId": "A" },
            { "expr": "surrealdb_storage_rocksdb_estimate_live_data_size", "legendFormat": "live data bytes", "refId": "B" }
          ]
        },
        {
          "type": "timeseries",
          "id": 13,
          "title": "query errors in the last hour, by class and database",
          "description": "INCREASE, not the raw counter, and that is the whole point of the panel. surrealdb_query_total is cumulative since the process started, so a total carries every fault since boot and looks alarming forever -- the same trap the fleet dashboard names about logstash sitting at 88 lifetime restarts behind a green 1/1 for 59 days.\n\nWhat is actionable here is RECURRENCE. On 2026-08-21 this store held 22 internal-class errors against the dodo database, beside 196865 successful queries -- 0.011 percent -- and not one of them had incremented since the scrape came up. They are historical, and they sit inside roughly 47 hours we have no visibility into, a window that contained a DiskPressure eviction of 30 pods, a kube-state-metrics crashloop and two Prometheus restarts. Any of those drops a client mid-query, which is a plausible internal-class error and is not a bug in the caller. Correlating 22 errors against four known disturbances would have found something, which is exactly why nobody went looking.\n\nSo this panel is the instrument that makes the next one real. A line that stays flat at zero means those 22 were the old world. A line that moves gives a bounded window and something worth chasing.\n\nerror_class separates them: client means a caller asked wrongly, internal means the store failed on its own account.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 38 },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "bars", "fillOpacity": 60 },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null }, { "color": "orange", "value": 1 }
              ]}
            }
          },
          "targets": [{
            "expr": "sum by (database, error_class) (increase(surrealdb_query_total{outcome=\"error\"}[1h]))",
            "legendFormat": "{{database}} / {{error_class}}",
            "refId": "A"
          }]
        }
      ]
    }
  job-market.json: |
    {
      "uid": "job-market",
      "title": "job market",
      "tags": ["albatross", "market"],
      "timezone": "browser",
      "refresh": "1m",
      "time": { "from": "now-7d", "to": "now" },
      "panels": [
        {
          "type": "stat",
          "id": 1,
          "title": "open postings",
          "description": "Postings seen within the last seven days. The nightly re-harvests every employer's board, so a live posting is re-seen every night and a week of silence is a closed role rather than a missed run.",
          "gridPos": { "h": 6, "w": 5, "x": 0, "y": 0 },
          "targets": [{ "expr": "albatross_postings_open", "refId": "A" }]
        },
        {
          "type": "stat",
          "id": 2,
          "title": "new in the last day",
          "description": "Postings first seen in the last 24 hours. This is the arrival rate -- what the market put up since yesterday, not what is up in total.",
          "gridPos": { "h": 6, "w": 5, "x": 5, "y": 0 },
          "targets": [{ "expr": "albatross_postings_new_1d", "refId": "A" }]
        },
        {
          "type": "gauge",
          "id": 3,
          "title": "ghost rate",
          "description": "Share of checked employers keeping postings on a rented board their own site links from NOWHERE -- so an ordinary visitor clicking Careers never sees them. See ghosts.ts for why that signature is checkable. This is the number that says how much of a search is spent on roles nobody is reading. It is one estate-wide figure -- ghost boards summed over checked boards summed -- so it stays a single number no matter how many albatross replicas are scraped; the old query divided the two per instance and drew one identical bar per pod. It was 85 of 193 on 2026-08-21 and 93 of 219 live, which is not a rounding error.",
          "gridPos": { "h": 6, "w": 5, "x": 10, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "orange", "value": 20 },
                { "color": "red", "value": 40 }
              ]}
            }
          },
          "targets": [{
            "expr": "100 * sum(albatross_boards_ghost) / clamp_min(sum(albatross_boards_checked), 1)",
            "refId": "A"
          }]
        },
        {
          "type": "stat",
          "id": 4,
          "title": "median posting lifetime",
          "description": "Days a posting stays up, measured ONLY over postings that have closed -- counting still-open ones would report how long they have been up so far and drag the median toward zero every time a batch arrives. It needs closed postings to mean anything: there were four closures on 2026-08-22, so this panel now shows nothing -- reading \"not yet answerable\" -- until at least 20 have closed, rather than drawing a confident zero over rows that have barely opened. It becomes a real median after a few harvest cycles.",
          "gridPos": { "h": 6, "w": 4, "x": 15, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "d", "noValue": "not yet answerable -- too few closed postings" } },
          "targets": [{ "expr": "albatross_posting_lifetime_days{quantile=\"0.5\"} and on(instance, pod) (albatross_posting_lifetime_closed >= 20)", "refId": "A" }]
        },
        {
          "type": "stat",
          "id": 5,
          "title": "postings not yet classified",
          "description": "READ THIS BEFORE THE THEME PANELS. Live postings carrying no demand theme, as a share of live postings.\n\nThe backfill has RUN. On 2026-08-21 this read 14646 of 14761 -- over 99 percent -- because themes are assigned at ingest and nothing is ever re-analyzed, so every posting harvested before the theme index landed on 2026-08-20 carried none. Running the theme pass over the corpus took it to 7088 of 14761, classifying 7673 postings and bringing all 22 themes into use where 19 had any members at all.\n\nSo what is left is no longer a backlog. Every job row has now been through assignThemes, and the nightly theme-read has drained the backlog: this reads 2915 of 15280, about 19 percent, which matches the store exactly (12365 of 15280 carry a theme). What remains are titles containing no keyword from any of the 22 themes -- a genuine coverage limit rather than work not yet done. THAT is the number a rediscovery run would address, and it could only be read honestly once the backfill had drained the other kind. Backfill first, then judge coverage; the two look identical from outside and have opposite remedies.\n\nThe panel keeps its place ahead of the theme charts because the breakdown below still omits this share, and it is worth knowing before reading the breakdown as the whole.",
          "gridPos": { "h": 6, "w": 5, "x": 19, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "orange", "value": 25 },
                { "color": "red", "value": 60 }
              ]}
            }
          },
          "targets": [{
            "expr": "100 * albatross_jobs_untyped / clamp_min(albatross_jobs_live, 1)",
            "refId": "A"
          }]
        },
        {
          "type": "bargauge",
          "id": 6,
          "title": "demand by theme, now",
          "description": "Live postings per demand theme -- what employers are trying to get done, not job families. A posting belongs to every theme whose keywords its title contains, so these deliberately OVERLAP and must not be summed or compared against the total.",
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 6 },
          "options": { "displayMode": "gradient", "orientation": "horizontal" },
          "targets": [{
            "expr": "topk(15, albatross_postings_by_theme)",
            "legendFormat": "{{theme}}",
            "refId": "A"
          }],
          "transformations": [
            { "id": "sortBy", "options": { "fields": {}, "sort": [{ "field": "Value", "desc": true }] } }
          ]
        },
        {
          "type": "timeseries",
          "id": 7,
          "title": "theme drift",
          "description": "The same series over time: is infra showing up more, is golang showing up more. NOTE THE CEILING -- Prometheus keeps seven days here, so this answers 'what moved this week' and can never answer 'what moved since June'. The long view needs the store, which has first_seen on every posting and does not forget.",
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 6 },
          "targets": [{
            "expr": "topk(10, albatross_postings_by_theme)",
            "legendFormat": "{{theme}}",
            "refId": "A"
          }]
        },
        {
          "type": "timeseries",
          "id": 8,
          "title": "arrivals per day",
          "description": "New postings per day beside the running total of what is open. The two moving together is a growing market; arrivals steady while open climbs means postings are not closing, which is the shape ghost boards make.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            { "expr": "albatross_postings_new_1d", "legendFormat": "new in last day", "refId": "A" },
            { "expr": "albatross_postings_open", "legendFormat": "open", "refId": "B" }
          ]
        },
        {
          "type": "timeseries",
          "id": 9,
          "title": "board posture, and reposting churn",
          "description": "broadcast means the employer publishes structured postings its own site links; quiet means it does not. Churn counts titles seen going down and back up again -- a role genuinely being filled does not do that, so churn is a second, independent signal of the same thing the ghost rate measures.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            { "expr": "albatross_boards_posture", "legendFormat": "{{posture}}", "refId": "A" },
            { "expr": "albatross_reposting_churn", "legendFormat": "reposting churn", "refId": "B" }
          ]
        }
      ]
    }
  claude-code.json: |
    {
      "uid": "claude-code",
      "title": "claude code",
      "tags": ["fleet", "claude"],
      "timezone": "browser",
      "refresh": "1m",
      "time": { "from": "now-24h", "to": "now" },
      "panels": [
        {
          "type": "stat",
          "id": 1,
          "title": "spend, last 24h",
          "description": "Every model call Claude Code made, in dollars. The metric is claude_code_cost_usage_USD_total -- note the capital USD, which is the OTLP unit suffix and is easy to mistype into an empty panel.\n\nWHY max_over_time AND NOT increase, on every panel here. Do not 'fix' these to rate() or increase(); it was tried and it returns nothing. These series are PUSHED by short-lived sessions, not scraped from a resident process. Each session owns its own series via session.id, counts up while it runs, and then that series ends forever. increase() and rate() need at least two samples inside the window, and a session that pushes once and exits never has two -- so every panel reads empty while the data sits right there. max_over_time takes each session's final value and sums across sessions, which is the correct total for counters that are cumulative WITHIN a lifetime rather than across one.\n\nThe consequence to keep in mind: on a timeseries this is a ROLLING window total -- spend attributable to sessions seen in the preceding window -- not spend that occurred in that instant.\n\nAnd this arrived at all only after two stacked faults were fixed on 2026-08-21: the endpoint was missing its /v1/metrics suffix, and Claude Code exports DELTA temporality which Prometheus drops silently while still registering the target. Before that the dashboard was blank and the target looked healthy.",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "currencyUSD", "decimals": 4 } },
          "targets": [{ "expr": "sum(max_over_time(claude_code_cost_usage_USD_total[24h]))", "refId": "A" }]
        },
        {
          "type": "stat",
          "id": 2,
          "title": "tokens, last 24h",
          "description": "All four kinds together: input, output, cacheRead and cacheCreation. The breakdown below is the interesting view -- a total is dominated by cacheRead on any real session and tells you very little on its own.",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [{ "expr": "sum(max_over_time(claude_code_token_usage_tokens_total[24h]))", "refId": "A" }]
        },
        {
          "type": "stat",
          "id": 3,
          "title": "sessions, last 24h",
          "description": "Counted by start_type: fresh, resume, continue, agents_view. A judge invocation is one session, which is why session.id is the one high-cardinality label the scrape config deliberately keeps.",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "targets": [{ "expr": "sum(max_over_time(claude_code_session_count_total[24h]))", "refId": "A" }]
        },
        {
          "type": "stat",
          "id": 4,
          "title": "active time, last 24h",
          "description": "Split user against cli. This is ACTIVE time, not wall-clock session duration -- true duration lives in the events stream, which Prometheus cannot take because its OTLP receiver accepts metrics only. If session length matters, that wants OTEL_LOGS_EXPORTER pointed at elasticsearch.",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [{ "expr": "sum(max_over_time(claude_code_active_time_seconds_total[24h]))", "refId": "A" }]
        },
        {
          "type": "timeseries",
          "id": 5,
          "title": "spend by model",
          "description": "Which models the money went to. The estate's review-fleet doctrine is cheap models for per-file passes and one expensive adversarial pass on top, so a fable line dwarfing the haiku lines is the shape to look for -- it means a fan-out inherited the session's effort instead of setting its own.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "fieldConfig": { "defaults": { "unit": "currencyUSD" } },
          "targets": [{
            "expr": "sum by (model) (max_over_time(claude_code_cost_usage_USD_total[1h]))",
            "legendFormat": "{{model}}",
            "refId": "A"
          }]
        },
        {
          "type": "timeseries",
          "id": 6,
          "title": "spend: foreground against background",
          "description": "query_source separates main -- the conversation you are having -- from auxiliary, which is everything Claude Code runs on your behalf without being asked: title generation, summarisation, background checks. Auxiliary is the line nobody thinks to look at, and it is the one that accrues while the session sits idle.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "fieldConfig": { "defaults": { "unit": "currencyUSD" } },
          "targets": [{
            "expr": "sum by (query_source) (max_over_time(claude_code_cost_usage_USD_total[1h]))",
            "legendFormat": "{{query_source}}",
            "refId": "A"
          }]
        },
        {
          "type": "timeseries",
          "id": 7,
          "title": "tokens by kind",
          "description": "input and output are what you pay full rate for. cacheRead is the prompt cache being reused and is billed at a fraction; cacheCreation is what it cost to put it there. On a long session cacheRead dominates everything else by an order of magnitude, which is the cache working rather than a problem.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [{
            "expr": "sum by (type) (max_over_time(claude_code_token_usage_tokens_total[1h]))",
            "legendFormat": "{{type}}",
            "refId": "A"
          }]
        },
        {
          "type": "gauge",
          "id": 8,
          "title": "prompt cache hit share",
          "description": "cacheRead as a share of everything read in (cacheRead plus input). High is good and expected: a long conversation re-sends its whole history every turn, and the cache is what stops that being billed at full rate every time. A sustained DROP is the interesting event -- it means the cache is being invalidated, which on this setup usually means the context was edited near the front rather than appended to.",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 14 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null },
                { "color": "orange", "value": 50 },
                { "color": "green", "value": 80 }
              ]}
            }
          },
          "targets": [{
            "expr": "100 * sum(max_over_time(claude_code_token_usage_tokens_total{type=\"cacheRead\"}[24h])) / clamp_min(sum(max_over_time(claude_code_token_usage_tokens_total{type=~\"input|cacheRead\"}[24h])), 1)",
            "refId": "A"
          }]
        },
        {
          "type": "timeseries",
          "id": 9,
          "title": "sessions started, by kind",
          "description": "fresh against resume and continue. A wall of fresh sessions where you expected resumes means context is being thrown away and rebuilt, which is paid for in cacheCreation on the panel above.",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 14 },
          "targets": [{
            "expr": "sum by (start_type) (max_over_time(claude_code_session_count_total[1h]))",
            "legendFormat": "{{start_type}}",
            "refId": "A"
          }]
        },
        {
          "type": "bargauge",
          "id": 10,
          "title": "most expensive sessions, last 24h",
          "description": "Cost per session.id. This is the panel the whole session.id cardinality argument was made for: two judge runs on the SAME pull request are separate sessions, and mesh.pr would collapse them into one series while this keeps them apart. A single session far above the others is the one worth opening.",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 22 },
          "options": { "displayMode": "gradient", "orientation": "horizontal" },
          "fieldConfig": { "defaults": { "unit": "currencyUSD", "decimals": 4 } },
          "targets": [{
            "expr": "topk(10, sum by (session_id) (max_over_time(claude_code_cost_usage_USD_total[24h])))",
            "legendFormat": "{{session_id}}",
            "refId": "A"
          }]
        },
        {
          "type": "timeseries",
          "id": 11,
          "title": "spend attributed to repo and PR",
          "description": "mesh.repo and mesh.pr are OURS, set through OTEL_RESOURCE_ATTRIBUTES by whatever spawns the session -- the judge wrapper sets them, so a ruling costs a known amount against a known pull request. EMPTY unless something sets them: an ordinary interactive session carries neither, and that is correct rather than missing.",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 22 },
          "fieldConfig": { "defaults": { "unit": "currencyUSD" } },
          "targets": [{
            "expr": "sum by (mesh_repo, mesh_pr, mesh_component) (max_over_time(claude_code_cost_usage_USD_total{mesh_repo!=\"\"}[24h]))",
            "legendFormat": "{{mesh_component}} {{mesh_repo}}#{{mesh_pr}}",
            "refId": "A"
          }]
        },
        {
          "type": "timeseries",
          "id": 12,
          "title": "spend by effort, agent and skill",
          "description": "The attribution the review-fleet doctrine needs: effort is low/medium/high/xhigh/max, and agent.name, skill.name and plugin.name name what spent it. These labels appear only on calls that carry them, so this panel is empty until a fan-out or a skill actually runs -- an interactive turn has no agent name to report.\n\nThe standing rule is that every fan-out agent sets effort explicitly rather than inheriting the session's, after a seven-agent fan-out at inherited effort took most of an allotment in half an hour. This is where that would now be visible while it happened.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 31 },
          "fieldConfig": { "defaults": { "unit": "currencyUSD" } },
          "targets": [
            { "expr": "sum by (effort) (max_over_time(claude_code_cost_usage_USD_total{effort!=\"\"}[1h]))", "legendFormat": "effort={{effort}}", "refId": "A" },
            { "expr": "sum by (agent_name) (max_over_time(claude_code_cost_usage_USD_total{agent_name!=\"\"}[1h]))", "legendFormat": "agent={{agent_name}}", "refId": "B" },
            { "expr": "sum by (skill_name) (max_over_time(claude_code_cost_usage_USD_total{skill_name!=\"\"}[1h]))", "legendFormat": "skill={{skill_name}}", "refId": "C" }
          ]
        },
        {
          "type": "timeseries",
          "id": 13,
          "title": "lines of code written and removed",
          "description": "Claude Code's own count of what it changed, split added against removed. Read it beside the estate's LOC collector rather than instead of it: this counts edits as they happen and does not know the difference between code and comment, while the collector reads the committed tree and does. A day of heavy editing here with no movement there is work that never landed.\n\nVerified live 2026-08-21 by running a session that edited a file and reading the series back.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 31 },
          "targets": [{
            "expr": "sum by (type) (max_over_time(claude_code_lines_of_code_count_total[1h]))",
            "legendFormat": "{{type}}",
            "refId": "A"
          }]
        },
        {
          "type": "timeseries",
          "id": 14,
          "title": "commits and pull requests",
          "description": "What actually reached git. Beside the lines-of-code panel this is the honest completion signal: edits are activity, commits are outcomes.\n\nTHE ONLY TWO NAMES ON THIS DASHBOARD NOT VERIFIED AGAINST A LIVE SERIES. Every other panel here was checked by emitting the metric and reading it back; these two need a Claude session to actually commit or open a pull request, which was not worth manufacturing. They follow the naming rule confirmed six times over -- dots to underscores, unit inserted when the metric has one, _total appended -- so they are near-certain rather than guessed. If they stay empty after a session that genuinely commits, suspect the name here before suspecting the pipeline.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 39 },
          "targets": [
            { "expr": "sum(max_over_time(claude_code_commit_count_total[1h]))", "legendFormat": "commits", "refId": "A" },
            { "expr": "sum(max_over_time(claude_code_pull_request_count_total[1h]))", "legendFormat": "pull requests", "refId": "B" }
          ]
        },
        {
          "type": "timeseries",
          "id": 15,
          "title": "edits accepted and rejected",
          "description": "Every edit Claude Code proposed, by tool, language and whether it was taken. A rising reject rate in one language is the most direct signal available that the work is going wrong in a way nobody has said out loud yet.\n\nVerified live 2026-08-21. Note that an auto-accepted edit still reports decision=accept with source naming what accepted it, so a wall of accepts under an automated permission mode is not the same evidence as a wall of accepts from a human.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 39 },
          "targets": [{
            "expr": "sum by (decision, tool_name, language) (max_over_time(claude_code_code_edit_tool_decision_total[1h]))",
            "legendFormat": "{{decision}} {{tool_name}} {{language}}",
            "refId": "A"
          }]
        }
      ]
    }
