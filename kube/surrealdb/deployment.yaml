apiVersion: apps/v1
kind: Deployment
metadata:
  name: surrealdb
  namespace: fleet
  labels:
    app.kubernetes.io/name: surrealdb
    app.kubernetes.io/part-of: fleet
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the data volume is ReadWriteOnce, and a
  # rolling replacement would deadlock -- the new pod cannot mount the claim
  # while the old one still holds it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: surrealdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: surrealdb
        app.kubernetes.io/part-of: fleet
    spec:
      containers:
        - name: surrealdb
          # Pinned point release, never a rolling tag: the piece must mean the
          # same thing on every converge. v3, not v2: dodo -- the first write
          # workload -- is built against 3.x semantics. The v2 store held
          # nothing (credential-less meant no write ever succeeded), so the
          # bump needs a clean /data/db rather than a storage migration; v3
          # refuses to open a v2 directory outright.
          image: surrealdb/surrealdb:v3.2.0
          # Durable engine on the mounted claim (tier-1 ruling 2026-07-06: a
          # pod restart losing everything is not tier-1 behavior). Credentials
          # arrive from the surrealdb-credentials Secret -- operator-created,
          # values never in a manifest. SurrealDB mints its initial root user
          # from SURREAL_USER/SURREAL_PASS at startup only while the store
          # holds no users, which closes the auth item the earlier version of
          # this header deferred to the schemaless-datastore work.
          # /data/db3, not /data/db: the old path holds the v2-format remains
          # of the never-written store, and v3 refuses to open it. Pointing at
          # a fresh directory costs a few dead megabytes on the claim and
          # avoids a destructive wipe; remove /data/db whenever a hand is in
          # there anyway.
          args: ["start", "--bind", "0.0.0.0:8000", "rocksdb:/data/db3"]
          envFrom:
            - secretRef:
                name: surrealdb-credentials
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
          # MEMORY BOUNDS, the operator's call of 2026-08-22, sized from the
          # store's own working set rather than guessed. Closes issue 136.
          #
          # Before this block the container had NO request and NO limit:
          # Best-Effort QoS, which on a node under pressure means FIRST in line
          # to be evicted -- the database dies before the dashboards do. And
          # it was the only unbounded thing on the node: elasticsearch (2Gi),
          # kafka (1536Mi) and kibana (1536Mi) all carry limits.
          #
          # The trend that forced it: working set 1.67 -> 1.79 -> 2.10 -> 3.12
          # -> 3.64 GiB across 2026-08-21, doubling in the last twelve hours
          # as four enrichment passes and the theme backfill wrote into it,
          # with the first full nightly harvest still ahead. 8 GiB tonight is
          # a projection from that curve, not a fear.
          #
          # request 6Gi: above today's 3.6 so the scheduler reserves what it
          # actually uses, and it becomes Burstable -- evicted after the
          # Best-Effort pods, not before them. limit 9Gi: one GiB over the
          # projection; past it the container is OOM-killed and RESTARTED
          # with its durable store intact, which is a visible event rather
          # than a node that quietly runs out. Both numbers want the VM at
          # 16 GiB: on the 12 GiB node this cluster had until tonight, 9Gi
          # here plus 5Gi of the other three ceilings over-commits the node.
          # Re-measure the curve after the first week of nightlies.
          resources:
            requests:
              cpu: 100m
              memory: 6Gi
            limits:
              memory: 9Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: surrealdb-data
