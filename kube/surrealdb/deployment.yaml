apiVersion: apps/v1
kind: Deployment
metadata:
  name: surrealdb
  namespace: fleet
  labels:
    app.kubernetes.io/name: surrealdb
    app.kubernetes.io/part-of: fleet
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the data volume is ReadWriteOnce, and a
  # rolling replacement would deadlock -- the new pod cannot mount the claim
  # while the old one still holds it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: surrealdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: surrealdb
        app.kubernetes.io/part-of: fleet
    spec:
      containers:
        - name: surrealdb
          # Pinned point release, never a rolling tag: the piece must mean the
          # same thing on every converge.
          image: surrealdb/surrealdb:v2.6.5
          # Durable engine on the mounted claim (tier-1 ruling 2026-07-06: a
          # pod restart losing everything is not tier-1 behavior). Still no
          # credentials -- secrets never live in manifests; without a
          # configured root user the server refuses privileged access, and
          # auth remains the schemaless-datastore work.
          args: ["start", "--bind", "0.0.0.0:8000", "rocksdb:/data/db"]
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: surrealdb-data
