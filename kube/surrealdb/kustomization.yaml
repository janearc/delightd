apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fleet

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: fleet

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml

# The first furniture manifest that lives IN delightd's kube/ rather than in
# another repo (see meubilair.yaml's source_manifest entries for the pieces
# that have not moved in yet).
#
# The earlier "no edge exposure for a datastore" stance is deliberately
# revised (2026-08-11): dodo runs on the workstation and writes here, and the
# ingressroute is the workstation's only path in. The exposure is the
# loopback-flavored surrealdb.localhost host rule, and the server now
# authenticates (see deployment.yaml), which the datastore did not when the
# stance was written.
