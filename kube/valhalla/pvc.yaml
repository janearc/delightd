# Valhalla's tile store: the routing graph it builds once and then mmaps on
# every start, plus the clipped OSM extract and the GTFS feed it was built
# from. This claim is the whole reason the piece is stateful -- throw it away
# and the next start re-fetches 650MB of norcal, re-clips it, and spends the
# better part of an hour rebuilding tiles, elevation and transit.
#
# SIZING -- MEASURED on the fleet 2026-08-22, after a real build. The earlier
# numbers here were estimates and they were wrong by about 5x, high:
#   valhalla_tiles.tar        206M
#   valhalla_tiles/           206M   (the tar is kept alongside the tree)
#   bayarea.osm.pbf           141M   (clipped, from a 649MB norcal)
#   timezone_data             123M
#   elevation_data             75M
#   admin_data                6.8M
#   ------------------------------------------------------------------
#   total                     755M   roads, elevation, admins, time zones
#
# Two surprises worth keeping. Elevation cost 75M, not the ~400M projected --
# it was talked about as the expensive switch and it is nearly the cheapest
# thing here. And timezone_data at 123M is the second-largest single item,
# which nobody would have guessed.
#
# STILL UNMEASURED: the 511 regional GTFS and the transit tiles built from it,
# because transit does not build until the feed is on the claim (see
# deployment.yaml). That is the entire reason this claim is not cut to 1Gi.
#
# 5Gi stays despite 755M of measured use, for two reasons rather than inertia.
# A bound PVC cannot be shrunk -- kubernetes rejects a decrease outright, so
# lowering this number would break `furnish up` against any cluster where the
# piece already exists. And local-path does not enforce the request anyway, so
# the number costs nothing real. Cut it at the next clean rebuild, once transit
# has been measured too.
#
# DISK EXCEPTION, the same shape as surrealdb's: local-path does NOT enforce
# this request. It provisions a plain directory under
# /var/lib/rancher/k3s/storage with no quota, and the real ceiling is the
# colima VM data disk -- /dev/vdb1, 57Gi total and 37Gi used as of this
# writing, shared by every PVC, all images, and etcd. The lever if it gets
# tight is `docker system prune`; ~12Gi was reclaimable at authoring time,
# which is more than this whole piece costs. As with surrealdb, the mitigation
# is monitoring, not a quota local-path cannot give. The growth risk ships
# named, not silent.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valhalla-tiles
  namespace: fleet
  labels:
    app.kubernetes.io/name: valhalla
    app.kubernetes.io/part-of: fleet
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
