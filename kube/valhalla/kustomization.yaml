apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fleet

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: fleet

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml

# Valhalla: an OSM routing engine, furniture in the strict meubilair sense --
# third-party, registers with nothing, speaks no delightd contract, answers
# plain HTTP.
#
# It is here to serve isochrones and origin-destination matrices for the job
# geography work: travel time between H3 cells by car, bike and foot, which is
# the expensive input to everything downstream.
#
# It serves two consumption patterns, and they want different things from it.
#
# BUILD-TIME, for car/bike/foot: cell-pair matrices come off /sources_to_targets
# once per (mode, time bucket), bake into a flat array, and are served from
# memory thereafter. Nothing goes dark if this piece is down; only re-bakes
# block.
#
# REQUEST-PATH, for transit: multimodal is not supported on the matrix endpoint,
# so a transit radius cannot be baked. It is asked live -- /isochrone with
# costing=multimodal, from whatever origin the operator clicked -- and the
# contour is converted to H3 cells and intersected against the job cells. That
# path DOES go dark when this piece is down.
#
# The second pattern is why the probes are worth keeping honest. It still runs
# one replica with no PodDisruptionBudget: the consumer is a workstation tool,
# and a few seconds of unavailability during a rollout is not worth the machinery
# to avoid. Revisit if anything unattended ever depends on the live path.
