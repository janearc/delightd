apiVersion: apps/v1
kind: Deployment
metadata:
  name: valhalla
  namespace: fleet
  labels:
    app.kubernetes.io/name: valhalla
    app.kubernetes.io/part-of: fleet
spec:
  replicas: 1
  # Recreate, not RollingUpdate, for the same reason surrealdb is: the tile
  # volume is ReadWriteOnce and a rolling replacement deadlocks -- the new pod
  # cannot mount the claim while the old one still holds it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: valhalla
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valhalla
        app.kubernetes.io/part-of: fleet
    spec:
      # THE CLIP. Geofabrik's smallest California cut is norcal, which reaches
      # Redding and eats roughly 6Gi of tiles and elevation for geography this
      # will never route through. There is no ready-made Bay Area extract worth
      # using: BBBike publishes SanFrancisco and SanJose, but they stop at
      # 37.54 and start at 37.46 respectively, leaving a hole over the
      # mid-Peninsula that Redwood City and Palo Alto fall straight into.
      #
      # So: fetch norcal once, clip it to the bbox, hand the result to valhalla
      # and throw the source away. The image builds from whatever PBF it finds
      # in /custom_files ("you could create custom_files on your host before
      # starting the container with all necessary files you want to be
      # respected, e.g. the OSM PBF files" -- upstream README), which is what
      # makes this work without patching the image.
      #
      # BBOX -122.60,37.05,-121.55,37.84 -- west to east, south to north:
      #   south 37.05  below Morgan Hill and San Martin, above Gilroy (37.006),
      #                which is the stated southern limit. This does cut
      #                Caltrain's Gilroy terminus.
      #   north 37.84  all of SF including Treasure Island; no Marin.
      #   west -122.60 ocean, past Pacifica and Half Moon Bay.
      #   east -121.55 clear of San Jose's eastern edge and Morgan Hill
      #                (-121.654), which a tighter cut would clip in half.
      # A rectangle over this geography necessarily includes the East Bay
      # shoreline -- the bay is a notch in the middle of it, not an edge. That
      # is not waste: it gives BART's Oakland and Fremont branches a pedestrian
      # network to connect their stops to.
      #
      # Idempotent by two guards, because this must not re-download 650MB on
      # every pod restart: it exits early if tiles already exist, and again if
      # the clipped PBF is already on the claim. It fails HARD rather than
      # soft, unlike the usual fail-soft network stance -- there is no useful
      # degraded mode where valhalla starts with no graph and no PBF to build
      # one from. That strictness only ever applies to the very first start.
      initContainers:
        - name: clip-extract
          # debian-slim plus the Debian osmium-tool package, because no osmium
          # image publishes linux/arm64 (checked ghcr.io/osgeo, stefda,
          # iboates -- 2026-08-22). The apt install is a one-time cost paid on
          # first build only; every later start hits a guard and exits.
          image: debian:bookworm-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              PBF=/custom_files/bayarea.osm.pbf
              if [ -f /custom_files/valhalla_tiles.tar ] || [ -d /custom_files/valhalla_tiles ]; then
                echo "clip: tiles already built, nothing to do"
                exit 0
              fi
              if [ -f "$PBF" ]; then
                echo "clip: $PBF already present, nothing to do"
                exit 0
              fi
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends osmium-tool ca-certificates curl
              SRC=/scratch/norcal.osm.pbf
              # emptyDir outlives a container restart within the same pod, so a
              # retry after a failed clip reuses the download instead of pulling
              # 650MB again. Costs one -s test; saves a lot of somebody's link.
              if [ -s "$SRC" ]; then
                echo "clip: source extract already in scratch, reusing"
              else
                echo "clip: fetching norcal extract"
                curl -fsSL -o "$SRC" \
                  https://download.geofabrik.de/north-america/us/california/norcal-latest.osm.pbf
              fi
              echo "clip: extracting bbox"
              # complete_ways keeps every node of a way that crosses the
              # boundary, so roads are not severed at the bbox edge. The
              # default simple strategy would leave dangling geometry that
              # routes badly along the border.
              #
              # -f pbf is load-bearing, not decorative. osmium infers the output
              # format from the file extension, and the .part suffix that makes
              # the write atomic defeats that inference outright: "Could not
              # detect file format for filename '...osm.pbf.part'". Found by
              # running it, not by reading it.
              osmium extract --bbox -122.60,37.05,-121.55,37.84 \
                --strategy complete_ways \
                -f pbf \
                -o "$PBF.part" "$SRC"
              mv "$PBF.part" "$PBF"
              rm -f "$SRC"
              echo "clip: done"
              ls -l "$PBF"
          volumeMounts:
            - name: tiles
              mountPath: /custom_files
            # The 650MB source lands on node ephemeral storage, never the
            # claim: it is deleted the moment the clip succeeds, and sizing the
            # claim for a file that exists for four minutes would be silly.
            - name: scratch
              mountPath: /scratch
      containers:
        - name: valhalla
          # Pinned point release, never a rolling tag, per the surrealdb
          # precedent: the piece must mean the same thing on every converge.
          #
          # gis-ops/docker-valhalla rather than the upstream valhalla/valhalla
          # image: upstream ships the binaries and leaves tile construction to
          # you, while this one takes a PBF URL and builds the graph on first
          # start, then reuses it. That first-start build is the entire reason
          # this piece can be stood up and forgotten.
          #
          # linux/arm64 is published for this tag (verified 2026-08-22), so it
          # runs native on the Apple Silicon colima VM. An amd64-only image
          # would run under emulation and turn the one-time tile build from
          # tens of minutes into hours.
          image: ghcr.io/gis-ops/docker-valhalla/valhalla:3.5.1
          env:
            # No tile_urls, deliberately. The initContainer has already put a
            # clipped PBF in /custom_files and the image builds from whatever
            # PBF it finds there. Setting tile_urls would pull the unclipped
            # norcal extract down on top of it and quietly undo the clip.
            # Elevation on, deliberately. It is the largest single contributor
            # to the tile footprint, and bike routing in this geography is
            # close to meaningless without grade: a 25-minute bike isochrone
            # drawn on flat-earth assumptions will happily put Twin Peaks and
            # the Embarcadero the same distance away.
            - name: build_elevation
              value: "True"
            # Admin regions, and time zones on top of them. Time zones are what
            # make departure-time-dependent routing answer correctly, which the
            # drive matrices want; admins are their prerequisite.
            - name: build_admins
              value: "True"
            - name: build_time_zones
              value: "True"
            # TRANSIT IS OFF UNTIL THE FEED IS ON THE CLAIM, and that ordering
            # is measured, not assumed. An earlier revision of this file set
            # True and claimed it was safe to ship ahead of the feeds because
            # the flag "only builds transit tiles if none exist yet". Running it
            # says otherwise: with build_transit=True and an empty /gtfs_feeds
            # the container dies with "Couldn't find any usable GTFS feeds" and
            # CrashLoopBackOffs. Worse, it attempts transit BEFORE the routing
            # tiles, so the failure costs you the road graph too -- nothing
            # builds at all. (Verified on the fleet 2026-08-22.)
            #
            # So activation is a deliberate two-step, in this order:
            #   1. furnish with this False. Roads, elevation, admins and time
            #      zones build; the piece comes up serving car/bike/foot.
            #   2. put the feed on the claim, flip this to True, restart:
            #        curl 'http://api.511.org/transit/datafeeds?api_key=KEY&operator_id=RG' -o rg.zip
            #        unzip rg.zip -d <claim>/gtfs_feeds/regional/
            #        kubectl -n fleet rollout restart deploy/valhalla
            #
            # operator_id=RG is the CONSOLIDATED regional feed -- Caltrain,
            # BART, Muni, VTA, SamTrans, AC Transit and the ferries in one
            # GTFS. That matters more than convenience: an inter-operator
            # transfer (Caltrain to BART at Millbrae) resolves properly inside
            # one feed, where separate per-operator feeds leave Valhalla
            # guessing at the connection. The key belongs to the operator and
            # never to this file, an argv, or a Secret named here -- which is
            # also why the pod does not fetch the feed itself.
            #
            # What it buys, once on: /isochrone with costing=multimodal, which
            # is what answers "draw a 45-minute transit radius from Atherton".
            # Note the asymmetry -- multimodal works on /route and /isochrone
            # and is explicitly NOT supported on /sources_to_targets, so
            # transit is an isochrone-and-intersect question and never a matrix
            # bake. Departure-time only; date_time type 2 (arrival) is
            # unimplemented for multimodal.
            #
            # One caveat to test rather than trust: Valhalla's transit routing
            # is less battle-worn than OpenTripPlanner's or r5's, and
            # multi-operator transfers are its hardest case. Before believing an
            # isochrone, route Sequoia Station to Embarcadero at 08:00 on a
            # weekday and check it against reality.
            - name: build_transit
              value: "False"
            # The set-and-forget switches. With these False the container
            # reuses whatever is already on the claim; flip one by hand (and
            # only by hand) to force a re-cut against a newer extract.
            - name: force_rebuild
              value: "False"
            - name: force_rebuild_elevation
              value: "False"
            # Once tiles exist, serve them without re-reading the PBF.
            - name: use_tiles_ignore_pbf
              value: "True"
            - name: server_threads
              value: "4"
          ports:
            - name: http
              containerPort: 8002
          volumeMounts:
            - name: tiles
              mountPath: /custom_files
            # The GTFS drop, on the same claim under a subPath rather than a
            # second volume: the feeds are build-time input that belongs with
            # the tiles they produce, and one claim is one thing to back up,
            # inspect, and reason about.
            - name: tiles
              mountPath: /gtfs_feeds
              subPath: gtfs_feeds
          # THE PROBE THAT MATTERS IS THE STARTUP ONE. First start downloads
          # 650MB and then builds routing tiles, admins, time zones and
          # elevation before the HTTP server ever binds 8002 -- tens of minutes,
          # plausibly longer on a busy node. A liveness probe with no
          # startupProbe in front of it would find nothing listening, restart
          # the pod, and discard the partial build; the piece would rebuild
          # forever and never come up. kubelet suppresses both other probes
          # until this one passes.
          #
          # 30s x 240 = two hours of grace. That is deliberately far past the
          # expected build: the cost of being generous is a slow failure
          # signal on a genuinely broken build, and the cost of being tight is
          # an infinite rebuild loop.
          startupProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 30
            failureThreshold: 240
          # /status answers 200 with the version and tileset timestamp once the
          # graph is loaded and the server can route. It needs no credentials
          # and does no tile walking (that is /status?verbose=true), so it is
          # cheap enough to poll.
          readinessProbe:
            httpGet:
              path: /status
              port: http
          livenessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 30
            failureThreshold: 3
          # Two different workloads share one container. The BUILD is the peak:
          # it holds graph structures in memory while it cuts tiles. SERVING is
          # cheap by comparison -- valhalla mmaps its tiles, so resident size
          # stays well under the build's high-water mark and the page cache
          # does the rest.
          #
          # request 512Mi is sized for the steady state, so the scheduler is not
          # holding build-sized memory hostage for the 99.9% of this piece's
          # life that is serving. limit 6Gi is headroom for the build; past it
          # the container is OOM-killed, which on first start means a restart
          # into a partial build rather than a quiet wedge.
          #
          # MEASURED 2026-08-22, serving roads after a real build: 291Mi
          # resident, 55m cpu. The 512Mi request is about right for the steady
          # state. The 6Gi limit is build headroom and is generous by a wide
          # margin -- the build finished well inside it -- but limits are not
          # reserved, so the ceiling costs nothing until a transit build has
          # been watched too. cpu has a request and no limit on
          # purpose: the build is embarrassingly parallel and CPU is
          # compressible, so a ceiling there buys nothing but a slower build.
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 6Gi
      volumes:
        - name: tiles
          persistentVolumeClaim:
            claimName: valhalla-tiles
        # Node ephemeral, for the unclipped source extract only.
        - name: scratch
          emptyDir: {}
