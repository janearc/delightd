apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fleet

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: fleet

resources:
  - elasticsearch.yaml

# Relocated from obs-svc (kube/elk/elasticsearch.yaml) so delightd owns the
# manifest ahead of obs-svc's sunset (T9). Manifest kept verbatim -- its 5Gi
# local-path PVC and xpack-off config come as-is; adopt-and-bring-current
# (reviewing those) is a separate follow-on.
