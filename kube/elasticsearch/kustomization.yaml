apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fleet

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: fleet

resources:
  - elasticsearch.yaml

# Relocated from obs-svc (kube/elk/elasticsearch.yaml) so delightd owns the
# manifest ahead of obs-svc's sunset (T9). Manifest kept verbatim; adopt-and-
# bring-current (the 5Gi local-path PVC, xpack off) is a separate follow-on.
